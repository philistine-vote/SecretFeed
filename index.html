
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>SecretFeed</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}
body{overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column;background:#000}
.top{height:48px;display:flex;align-items:center;justify-content:center;gap:20px;flex-shrink:0;background:#000;z-index:3}
.top span{font-size:15px;color:#aaa}
.top .active{font-weight:bold;color:#fff;border-bottom:2px solid #fff;padding-bottom:7px}
.brand{position:absolute;left:12px;font-size:17px;font-weight:bold;color:#a58bff}
.feed{flex:1;min-height:0;position:relative;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.video-card{height:100%;height:100%;position:relative;scroll-snap-align:start;background:#171717;overflow:hidden}
.video-card video{width:100%;height:100%;object-fit:cover;background:#171717}
.placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:linear-gradient(145deg,#282137,#111);color:#ddd}
.placeholder .play{font-size:60px;color:#a58bff}
.placeholder small{color:#aaa}
.uploaded{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.right{position:absolute;right:10px;bottom:100px;display:flex;flex-direction:column;align-items:center;gap:19px;z-index:2}
.action{border:0;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:25px;text-shadow:0 1px 4px #000;padding:0}
.action small{font-size:11px}
.avatar{width:43px;height:43px;border:2px solid white;border-radius:50%;background:#a58bff;display:grid;place-items:center;font-size:22px}
.info{position:absolute;left:12px;right:75px;bottom:18px;text-shadow:0 1px 4px #000;z-index:2}
.username{font-weight:bold;margin-bottom:8px}
.caption{font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.sound{font-size:12px;margin-top:8px}
.bottom{height:58px;flex-shrink:0;display:flex;justify-content:space-around;align-items:center;background:#080808;border-top:1px solid #222;z-index:4}
.nav{border:0;background:none;color:#aaa;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.nav b{font-size:21px;color:inherit}
.nav.active{color:#fff}
.plus{font-size:26px!important;color:#000!important;background:#fff;border-radius:7px;padding:0 10px;line-height:25px}
input[type=file]{display:none}
.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#222;padding:12px 16px;border-radius:10px;z-index:8;display:none}
@media(min-width:600px){.app{max-width:440px;margin:auto;border-left:1px solid #222;border-right:1px solid #222}.top,.bottom{flex-shrink:0}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">✦ SF</div>
    <span>Following</span><span class="active">For You</span>
  </header>

  <main class="feed" id="feed">
    <section class="video-card">
      <div class="placeholder" id="placeholder">
        <div class="play">▶</div>
        <strong>SecretFeed</strong>
        <small>তোর ভিডিও এখানে দেখা যাবে</small>
        <button onclick="document.getElementById('file').click()" style="background:#a58bff;border:0;padding:10px 15px;border-radius:8px">＋ ভিডিও যোগ কর</button>
      </div>
      <video id="video" playsinline loop controls style="display:none"></video>
      <div class="right">
        <div class="avatar">👤</div>
        <button class="action" onclick="like(this)">♡<small>Like</small></button>
        <button class="action" onclick="showMsg('কমেন্ট ফিচার পরে যুক্ত হবে')">▢<small>Comment</small></button>
        <button class="action" onclick="showMsg('ভিডিও শেয়ার করতে ব্রাউজারের Share অপশন ব্যবহার কর')">➦<small>Share</small></button>
        <button class="action" onclick="showMsg('ফেভারিট ফিচার পরে যুক্ত হবে')">☆<small>Favorite</small></button>
      </div>
      <div class="info">
        <div class="username">@Azmain · SecretFeed</div>
        <div class="caption" id="caption">আমার প্রথম SecretFeed ভিডিও 🤯 #SecretFeed</div>
        <div class="sound">♫ Original sound - Azmain</div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <input id="file" type="file" accept="video/*">
  <nav class="bottom">
    <button class="nav active" onclick="goHome()"><b>⌂</b>Home</button>
    <button class="nav" onclick="showMsg('Discover ফিচার পরে যুক্ত হবে')"><b>⌕</b>Discover</button>
    <button class="nav" onclick="document.getElementById('file').click()"><b class="plus">＋</b>Upload</button>
    <button class="nav" onclick="showMsg('Inbox ফিচার পরে যুক্ত হবে')"><b>✉</b>Inbox</button>
    <button class="nav" onclick="showMsg('Profile ফিচার পরের ধাপে তৈরি করব')"><b>♙</b>Profile</button>
  </nav>
</div>
<script>
const file=document.getElementById('file');
file.addEventListener('change',function(){
  const f=this.files&&this.files[0];
  if(!f)return;
  if(!f.type.startsWith('video/')){showMsg('একটি ভিডিও ফাইল নির্বাচন কর');return;}
  const video=document.getElementById('video');
  video.src=URL.createObjectURL(f);
  video.style.display='block';
  document.getElementById('placeholder').style.display='none';
  video.play().catch(()=>{});
  document.getElementById('caption').textContent=f.name;
  showMsg('ভিডিওটি এই ফোনে প্রিভিউ হচ্ছে');
});
function like(btn){
  const liked=btn.dataset.liked==='true';
  btn.dataset.liked=String(!liked);
  btn.firstChild.textContent=liked?'♡':'♥';
  btn.style.color=liked?'#fff':'#ff4f82';
}
function showMsg(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>t.style.display='none',2200);
}
function goHome(){
  document.getElementById('feed').scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
